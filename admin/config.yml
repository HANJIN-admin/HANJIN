backend:
  name: git-gateway
  branch: main

# 로그인/승인 없이 임시로 로컬에서 테스트해볼 때만 아래 주석을 해제하세요.
# local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "ko"

collections:
  - name: "portfolio"
    label: "시공사례"
    label_singular: "시공사례 항목"
    description: "사업영역 갤러리에 표시되는 시공사례 목록입니다. 사진은 1장만 올리면 목록/상세 페이지 모두에 자동으로 사용됩니다."
    file: "content/portfolio.json"
    format: "json"
    fields:
      - { name: "items", label: "시공사례 목록", widget: "list", summary: "{{fields.category}} · {{fields.title}} ({{fields.date}})", fields: [
          { name: "id", label: "고유 ID", hint: "다른 항목과 겹치지 않는 영문/숫자 조합 (예: p074). 한 번 정하면 나중에 바꾸지 마세요.", widget: "string" },
          { name: "title", label: "프로젝트명", widget: "string" },
          { name: "category", label: "사업분야", widget: "select", options: ["건축", "토목", "플랜트", "기타"] },
          { name: "date", label: "날짜", widget: "date", format: "YYYY-MM-DD" },
          { name: "location", label: "위치", widget: "string", required: false },
          { name: "client", label: "발주처 (선택)", widget: "string", required: false },
          { name: "period", label: "공사기간 (선택)", widget: "string", required: false, hint: "예: 2024.03 ~ 2024.11" },
          { name: "scale", label: "규모 (선택)", widget: "string", required: false, hint: "예: 연면적 3,200㎡" },
          { name: "work_type", label: "주요공종 (선택)", widget: "string", required: false, hint: "예: 토공사, 철근콘크리트공사" },
          { name: "image", label: "대표 사진", widget: "image", media_library: { config: { multiple: false } } },
          { name: "gallery", label: "추가 사진 (선택)", widget: "list", field: { name: "photo", widget: "image" }, required: false },
          { name: "body", label: "상세 설명 (선택)", widget: "text", required: false },
        ] }

  - name: "jobs"
    label: "채용공고"
    label_singular: "채용공고"
    description: "채용 > 채용공고 페이지와 홈 화면에 표시됩니다."
    file: "content/jobs.json"
    format: "json"
    fields:
      - { name: "items", label: "채용공고 목록", widget: "list", summary: "{{fields.title}} ({{fields.status}})", fields: [
          { name: "title", label: "공고 제목", widget: "string" },
          { name: "status", label: "상태", widget: "select", options: ["모집중", "마감"] },
          { name: "period", label: "접수 기간", widget: "string", hint: "예: 상시채용, 2026-10-01 ~ 2026-10-31" },
          { name: "body", label: "상세 요강", widget: "text" },
          { name: "attachment", label: "첨부파일 (선택)", widget: "file", required: false },
        ] }

  - name: "news"
    label: "뉴스룸"
    label_singular: "게시물"
    description: "뉴스룸 > 공지사항 · 보도자료 게시판에 표시됩니다."
    file: "content/news.json"
    format: "json"
    fields:
      - { name: "items", label: "게시물 목록", widget: "list", summary: "[{{fields.type}}] {{fields.title}} ({{fields.date}})", fields: [
          { name: "id", label: "고유 ID", hint: "다른 게시물과 겹치지 않는 영문/숫자 조합 (예: n002)", widget: "string" },
          { name: "title", label: "제목", widget: "string" },
          { name: "type", label: "구분", widget: "select", options: ["공지사항", "보도자료"] },
          { name: "date", label: "작성일", widget: "date", format: "YYYY-MM-DD" },
          { name: "author", label: "작성자", widget: "string", default: "관리자" },
          { name: "body", label: "본문", widget: "text" },
          { name: "attachment", label: "첨부파일 (선택)", widget: "file", required: false },
        ] }
